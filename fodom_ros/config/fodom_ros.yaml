fodom_ros_node:
  ros__parameters:
    # Frames
    odom_frame: "odom"
    sensor_frame: "os_sensor"

    # Publishing toggles
    publish_tf: true
    publish_odom: false
    publish_path: true
    publish_keyframe: true

    # Point cloud filtering
    min_range: 1.0
    max_range: 30.0
    min_intensity: 1300

    # KD-tree
    kdtree.max_points_per_leaf: 10
    kdtree.max_depth: 32
    kdtree.max_parallel_level: 4
    kdtree.leaf_extent_sq: 0.01   # [m²] min largest eigenvalue to allow splitting (~0.2m patch extent)
    kdtree.planar_ratio: 0.2      # λ_min/λ_max threshold for planarity

    # ICP
    icp.n_iters: 20
    icp.damping: 0.0
    icp.max_correspondence_dist: 0.15 # [m] reject matches beyond this
    icp.huber_delta: 0.07

    # Scan duration [s] — must match LiDAR spin period (e.g. 0.1 for 10 Hz, 0.05 for 20 Hz)
    scan_dt: 0.1

    # Keyframe policy
    keyframe_min_ratio: 0.3
    max_keyframes: 4

    # EKF gravity vector [m/s^2] (world frame, typically [0, 0, -9.81] for ENU)
    ekf.gravity: [0.0, 0.0, -9.80]

    # EKF noise parameters
    ekf.accel_noise:   0.6      # [m/s^2]   accelerometer white noise density
    ekf.gyro_noise:    0.01     # [rad/s]   gyroscope white noise density
    ekf.accel_bias_rw: 1.0e-4   # [m/s^3]   accelerometer bias random walk
    ekf.gyro_bias_rw:  1.0e-6   # [rad/s^2] gyroscope bias random walk
    # EKF stillness detection (use imu_noise_calib to tune these)
    ekf.calib_samples:  200
    ekf.still_window:   0.5
    ekf.still_accel_var: 0.00164009
    ekf.still_gyro_var:  1.28531e-06
    ekf.still_accel_thr: 0.108171
    ekf.still_gyro_thr:  0.0257203

    # EKF ZUPT (zero-velocity update when stationary)
    ekf.do_zupt:    true
    ekf.zupt_noise: 1.0e-4   # [m/s] velocity measurement noise when still

    # EKF initial covariances (diagonal variances after calibration)
    ekf.init_pos_var:        1.0e-3
    ekf.init_vel_var:        1.0e-3
    ekf.init_rot_var:        1.0e-3
    ekf.init_accel_bias_var: 1.0e-3
    ekf.init_gyro_bias_var:  1.0e-6

    # IMU-in-LiDAR extrinsics (row-major 4x4 homogeneous transform)
    imu_in_lidar: [1.0, 0.0, 0.0, -0.002,
                   0.0, 1.0, 0.0, -0.010,
                   0.0, 0.0, 1.0,  0.008,
                   0.0, 0.0, 0.0, 1.0]
