fodom_ros_node:
  ros__parameters:
    # Frames
    odom_frame: "odom"
    sensor_frame: "os_sensor"

    # Publishing toggles
    publish_tf: true
    publish_odom: false
    publish_path: true
    publish_keyframe: true

    # Point cloud filtering
    min_range: 1.0
    max_range: 30.0
    min_intensity: 1300

    # KD-tree
    max_points_per_leaf: 20
    max_depth: 16
    max_parallel_level: 4

    # ICP
    icp_n_iters: 10
    icp_damping: 0.0
    icp_max_correspondence_dist: 0.2 # [m] reject matches beyond this

    # Keyframe policy
    keyframe_min_ratio: 0.3

    # EKF noise parameters
    ekf.accel_noise:   0.1      # [m/s^2]   accelerometer white noise density
    ekf.gyro_noise:    0.01     # [rad/s]   gyroscope white noise density
    ekf.accel_bias_rw: 1.0e-4   # [m/s^3]   accelerometer bias random walk
    ekf.gyro_bias_rw:  1.0e-5   # [rad/s^2] gyroscope bias random walk
    ekf.pos_noise:     0.05     # [m]       position measurement noise
    ekf.rot_noise:     0.01     # [rad]     rotation measurement noise

    # EKF stillness detection (use imu_noise_calib to tune these)
    ekf.calib_samples:  200
    ekf.still_window:   0.5
    ekf.still_accel_var: 0.00164009
    ekf.still_gyro_var:  1.28531e-06
    ekf.still_accel_thr: 0.108171
    ekf.still_gyro_thr:  0.0257203

    # IMU-in-LiDAR extrinsics (row-major 4x4 homogeneous transform)
    imu_in_lidar: [1.0, 0.0, 0.0, -0.002,
                   0.0, 1.0, 0.0, -0.010,
                   0.0, 0.0, 1.0,  0.008,
                   0.0, 0.0, 0.0, 1.0]
